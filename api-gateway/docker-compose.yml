version: '3.8'  # '4' is not officially a Docker Compose version. Use 3.8 (latest)

services:
  keycloak-mysql:
    container_name: keycloak-mysql
    image: mysql:8
    volumes:
      - ./volume-data/mysql_keycloak_data:/var/lib/mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:24.0.1
    command: start-dev --import-realm
    environment:
      KC_DB: mysql                    # ✅ Correct new way
      KC_DB_URL_HOST: keycloak-mysql   # ✅ Must match the service name of MySQL
      KC_DB_URL_PORT: 3306             # ✅ Inside docker network
      KC_DB_USERNAME: keycloak         # ✅ Your user
      KC_DB_PASSWORD: password         # ✅ Your password
      KEYCLOAK_ADMIN: admin             # ✅ Admin user
      KEYCLOAK_ADMIN_PASSWORD: admin    # ✅ Admin password
    ports:
      - "8181:8080"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/
    depends_on:
      - keycloak-mysql
#

  mysql-backup:
    container_name: mysql-backup
    image: mysql:8
    restart: unless-stopped
    volumes:
      - ./backup:/backup
    command: >
      bash -c "
      echo 'Waiting for keycloak-mysql to be reachable...';
      until mysqladmin ping -hkeycloak-mysql -uroot -proot --silent; do
        echo 'Database not ready, sleeping 5s...';
        sleep 5;
      done;
      echo 'Database is ready, starting backup loop...';
      mkdir -p /backup;
      while true; do
        TIMESTAMP=$(date +%Y%m%d%H%M%S);
        echo 'Backing up at' \$TIMESTAMP;
        mysqldump --host=keycloak-mysql --user=root --password=root keycloak > /backup/keycloak_backup_\${TIMESTAMP}.sql;
        sleep 60;
      done
      "
    depends_on:
      - keycloak-mysql
